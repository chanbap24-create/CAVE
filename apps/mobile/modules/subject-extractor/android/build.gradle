apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.subjectextractor'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle",
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.subjectextractor"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // ML Kit Subject Segmentation. Beta as of 2026-04 — bump when a stable line
  // ships. First call downloads ~5MB model silently; cache the wrapper result.
  implementation 'com.google.mlkit:segmentation-subject:16.0.0-beta1'
}
